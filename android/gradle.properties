org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Keep the Android build predictable for this local-first client. Screenshot
# recognition bundles its offline OCR engine and model assets.
shrink=false
# Standalone ABI APKs use the app version code so subsequent universal APKs
# can upgrade them. Play multi-APK releases require their own version scheme.
force-version-code-ignoring-abi=true
